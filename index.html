<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>原点编剧系统</title>
    <meta
      name="description"
      content="以幕、剧情卡和场为主链，支持角色、类型约束与锁定层联动的编剧工作台。"
    />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div class="hero__copy">
          <p id="hero-eyebrow" class="eyebrow">项目中心</p>
          <h1 id="hero-title">项目中心</h1>
          <p id="hero-description" class="hero__text">这里只显示项目列表。</p>
        </div>
        <div id="hero-stepper-nav" class="hero-stepper-nav" hidden></div>
        <div class="hero__side">
          <div class="hero__actions">
            <div id="toolbar-mode-group" class="toolbar-mode-group" hidden>
              <button id="toolbar-density-button" class="button button--ghost button--tiny" type="button" data-action="toggle-toolbar-density">展开</button>
              <button id="toolbar-hide-button" class="button button--ghost button--tiny" type="button" data-action="hide-toolbar">隐藏</button>
            </div>
            <button id="save-button" class="button button--primary" type="button">立即保存</button>
            <button id="page-project-button" class="button button--ghost button--tiny" type="button">项目中心</button>
            <button id="open-settings-button" class="button button--ghost button--tiny" type="button">设置</button>
            <button id="page-workflow-button" class="button button--ghost button--tiny" type="button" hidden>
              创作页
            </button>
          </div>
          <div id="runtime-status" class="summary-strip summary-strip--hero"></div>
        </div>
      </header>
      <button id="toolbar-reveal-button" class="toolbar-reveal" type="button" data-action="show-toolbar" hidden>显示工作栏</button>

      <section id="wizard-shell" class="wizard-shell" data-page="workflow">
        <div class="wizard-shell__head">
          <div>
            <p class="panel__eyebrow">创作流程</p>
            <h2 id="step-title">结构页</h2>
            <p id="step-description" class="hero__text"></p>
          </div>
          <div class="wizard-shell__meta">
            <span id="step-count-chip" class="chip chip--soft">1 / 6</span>
          </div>
        </div>
        <div id="stepper-nav" class="stepper-nav" aria-label="创作步骤"></div>
        <div class="wizard-actions" hidden>
          <button id="step-prev-button" class="button button--ghost" type="button">上一步</button>
          <button id="step-next-button" class="button button--primary" type="button">下一步</button>
        </div>
      </section>

      <main class="workspace">
        <section id="panel-projects" class="panel panel--projects" data-page="project">
          <div id="project-list" class="project-board"></div>
        </section>

        <section
          id="panel-structure"
          class="panel panel--workflow panel--structure"
          data-page="workflow"
          data-step-group="structure"
        >
          <div class="panel__header">
            <div>
              <p class="panel__eyebrow">结构层</p>
              <h2>结构页</h2>
            </div>
          </div>
          <div id="structure-content"></div>
        </section>

        <section id="panel-plots" class="panel panel--workflow" data-page="workflow" data-step-group="plots">
          <div class="panel__header">
            <div>
              <p class="panel__eyebrow">剧情层</p>
              <h2>剧情板</h2>
            </div>
          </div>
          <div id="plots-content"></div>
        </section>

        <section
          id="panel-characters"
          class="panel panel--workflow"
          data-page="workflow"
          data-step-group="characters"
        >
          <div class="panel__header">
            <div>
              <p class="panel__eyebrow">角色层</p>
              <h2>角色台</h2>
            </div>
          </div>
          <div id="characters-content"></div>
        </section>

        <section
          id="panel-relationships"
          class="panel panel--workflow"
          data-page="workflow"
          data-step-group="relationships"
        >
          <div class="panel__header">
            <div>
              <p class="panel__eyebrow">关系层</p>
              <h2>关系台账</h2>
            </div>
          </div>
          <div id="relationships-content"></div>
        </section>

        <section id="panel-genres" class="panel panel--workflow" data-page="workflow" data-step-group="genres">
          <div class="panel__header">
            <div>
              <p class="panel__eyebrow">类型层</p>
              <h2>类型约束</h2>
            </div>
          </div>
          <div id="genres-content"></div>
        </section>

        <section id="panel-locks" class="panel panel--workflow" data-page="workflow" data-step-group="locks">
          <div class="panel__header">
            <div>
              <p class="panel__eyebrow">锁定层</p>
              <h2>锁定层</h2>
            </div>
          </div>
          <div id="locks-content"></div>
        </section>

        <section id="panel-scenes" class="panel panel--workflow" data-page="workflow" data-step-group="scenes">
          <div class="panel__header">
            <div>
              <p class="panel__eyebrow">脚本层</p>
              <h2>场景页</h2>
            </div>
          </div>
          <div id="scenes-content"></div>
        </section>
      </main>

      <div id="project-create-dialog" class="dialog-backdrop" hidden>
        <section class="dialog-panel dialog-panel--wizard">
          <div class="panel__header">
            <div>
              <p id="project-create-eyebrow" class="panel__eyebrow">新增项目</p>
              <h2 id="project-create-title">定义形态</h2>
              <p id="project-create-description" class="hero__text"></p>
            </div>
          </div>
          <div class="wizard-progress">
            <div id="project-create-progress" class="wizard-progress__bar"></div>
          </div>
          <div class="summary-card">
            <div id="project-create-form" class="form-grid"></div>
            <div class="wizard-actions">
              <button id="cancel-create-project-button" class="button button--ghost" type="button">取消</button>
              <button id="confirm-create-project-button" class="button button--primary" type="button">
                创建并进入创作
              </button>
            </div>
          </div>
        </section>
      </div>
    </div>

    <div id="settings-dialog" class="dialog-backdrop" hidden>
      <section class="dialog-panel">
        <div class="panel__header">
          <div>
            <p class="panel__eyebrow">全局设置</p>
            <h2>模型连接</h2>
            <p class="hero__text">在这里连接模型、获取模型列表并切换当前使用的模型。</p>
          </div>
        </div>
        <div id="settings-form"></div>
        <div class="wizard-actions">
          <button id="reset-button" class="button button--ghost" type="button">重置当前项目</button>
          <button id="close-settings-button" class="button button--ghost" type="button">关闭</button>
        </div>
      </section>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
